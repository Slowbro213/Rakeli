<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="HEXEN - Penetration Tester & Penetration Tester Portfolio"
		/>
		<title>HEXEN // ${page_title}</title>
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" />
		<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()" />
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<link rel="stylesheet" href="../assets/css/writeups.css" />
	</head>

	<body class="cyberpunk-body">
		<!-- Matrix Rain Background -->
		<div id="matrix-rain" class="matrix-rain"></div>

		<!-- Navigation -->
		<nav
			class="cyber-nav fixed top-0 left-0 w-full z-50 bg-black bg-opacity-80 backdrop-blur-sm border-b border-neongreen"
		>
			<div class="container mx-auto px-4 py-3">
				<div class="flex justify-between items-center">
					<div class="cyber-logo">
						<span
							class="text-neongreen font-bold text-xl glitch-effect"
							data-text="HEXEN"
							>HEXEN</span
						>
						<span class="text-neonpink text-sm ml-2"
							>// SECURITY_SPECIALIST</span
						>
					</div>

					<!-- Desktop Menu -->
					<div class="hidden md:flex space-x-6">
						<a href="../" class="nav-link">HOME</a>
						<a href="../about.html" class="nav-link">ABOUT</a>
						<a href="../writeups.html" class="nav-link">WRITEUPS</a>
						<a href="../blogs.html" class="nav-link">BLOGS</a>
					</div>

					<!-- Mobile Menu Button -->
					<div class="md:hidden mt-4">
						<button
							id="mobile-menu-button"
							type="button"
							class="text-neongreen focus:outline-none"
						>
							<svg
								class="h-6 w-6 transition-transform duration-300"
								id="menu-icon"
								fill="none"
								viewBox="0 0 24 24"
								stroke="currentColor"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M4 6h16M4 12h16M4 18h16"
								></path>
							</svg>
							<svg
								class="h-6 w-6 transition-transform duration-300 hidden"
								id="close-icon"
								fill="none"
								viewBox="0 0 24 24"
								stroke="currentColor"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M6 18L18 6M6 6l12 12"
								></path>
							</svg>
						</button>
					</div>
				</div>

				<!-- Mobile Menu (hidden by default) -->
				<div
					id="mobile-menu"
					class="md:hidden mt-2 border-t border-neongreen border-opacity-30 transform origin-top transition-all duration-300 scale-y-0 opacity-0 max-h-0"
				>
					<div class="flex flex-col space-y-4">
						<a href="../index.html" class="nav-link">HOME</a>
						<a href="../about.html" class="nav-link">ABOUT</a>
						<a href="../writeups.html" class="nav-link">WRITEUPS</a>
						<a href="../blogs.html" class="nav-link">BLOGS</a>
					</div>
				</div>
			</div>
		</nav>

		<main class="relative z-10 pt-20">
			<section id="writeup-controls" class="px-6 pt-6 pb-2 text-center">
  <div class="filter-container mb-6 w-full" >
    <input
      type="text"
      id="search-input"
      placeholder="Search writeups..."
      class="bg-black border border-neongreen text-neongreen rounded-md px-4 py-2 max-w-1/2 focus:outline-none focus:ring-2 focus:ring-neonpink"
    />
  </div>

  <div id='tags-container'>
    ${tags}
  </div>
</section>

${series_nav}
<!-- Writeup content -->
<article class="markdown-body">${content}</article>
${series_nav}

			<!-- Footer -->
			<footer
				class="cyber-footer py-12 bg-black border-t border-gray-800 mt-12"
			>
				<div class="container mx-auto px-4">
					<div class="flex flex-col md:flex-row justify-between items-center">
						<div class="mb-6 md:mb-0">
							<h3 class="text-2xl font-bold mb-2 text-neongreen">HEXEN</h3>
							<p class="text-sm text-gray-400 cyber-text">
								Penetration Testing
							</p>
						</div>
						<div class="flex space-x-6">
							<a
								href="https://www.linkedin.com/in/rakelspahi/"
								target="_blank"
								rel="noopener noreferrer"
								class="hover:text-neonblue transition-colors cyber-link"
								>LinkedIn</a
							>
							<a
								href="#"
								class="hover:text-neonpink transition-colors cyber-link"
								>GitHub</a
							>
						</div>
					</div>
					<div
						class="border-t border-gray-800 mt-8 pt-8 text-center text-sm text-gray-400"
					>
						<p class="cyber-text">
							© 2026 HEXEN. All systems operational.
							<span class="text-neongreen">//</span> Secure by design.
						</p>
					</div>
				</div>
			</footer>
		</main>
		<script type="module" src="../assets/js/menu.js" defer></script>
	</body>
</html>
